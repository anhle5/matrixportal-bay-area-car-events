name: Daily car events scrape

on:
  schedule:
    - cron: "0 15 * * *" # 08:00 America/Los_Angeles (approx; UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape events
        run: python3 scrape_events.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update events.json from bayareamotorevents.com"
            git push
          fi
